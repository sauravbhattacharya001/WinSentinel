name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [cli, service]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      shell: bash
      run: |
        repo="${REGISTRY}/${IMAGE_NAME,,}"
        target="${{ matrix.target }}"
        if [[ "$target" == "cli" ]]; then image_name="$repo"; else image_name="${repo}-${target}"; fi

        tags=()
        if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
          version="${BASH_REMATCH[1]}"
          tags+=("${image_name}:${version}" "${image_name}:latest")
          if [[ "$version" =~ ^([0-9]+\.[0-9]+) ]]; then tags+=("${image_name}:${BASH_REMATCH[1]}"); fi
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          tags+=("${image_name}:main" "${image_name}:sha-${GITHUB_SHA:0:7}")
        else
          tags+=("${image_name}:pr-${{ github.event.number }}" "${image_name}:sha-${GITHUB_SHA:0:7}")
        fi

        {
          echo 'tags<<EOF'
          printf '%s\n' "${tags[@]}"
          echo 'EOF'
          echo "primary=${tags[0]}"
          echo "image_name=${image_name}"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        target: ${{ matrix.target }}
        push: ${{ github.event_name != 'pull_request' }}
        load: ${{ github.event_name == 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}

    - name: Image summary
      run: |
        {
          echo "## 🐳 Docker Image: ${{ matrix.target }}"
          echo
          echo "| Property | Value |"
          echo "|----------|-------|"
          echo '| Image | `${{ steps.meta.outputs.primary }}` |'
          echo '| Digest | `${{ steps.build.outputs.digest || 'local build only' }}` |'
          echo
          echo "### Tags"
          while IFS= read -r tag; do [[ -n "$tag" ]] && echo "- \`$tag\`"; done <<< "${{ steps.meta.outputs.tags }}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Scan image for vulnerabilities
      if: github.event_name != 'pull_request'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.meta.outputs.primary }}
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH
      continue-on-error: true

    - name: Upload vulnerability scan (SARIF)
      if: github.event_name != 'pull_request'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.meta.outputs.primary }}
        format: sarif
        output: trivy-results-${{ matrix.target }}.sarif
        severity: CRITICAL,HIGH,MEDIUM
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results-${{ matrix.target }}.sarif
        category: trivy-${{ matrix.target }}
      continue-on-error: true

    - name: Generate SBOM
      if: github.event_name != 'pull_request'
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.meta.outputs.primary }}
        artifact-name: sbom-${{ matrix.target }}.spdx.json
        output-file: sbom-${{ matrix.target }}.spdx.json
      continue-on-error: true

    - name: Attest build provenance
      if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ steps.meta.outputs.image_name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
      continue-on-error: true
