name: E2E Smoke Test

# End-to-end: builds CLI, runs a real audit, validates JSON output structure.
# Issue: #220

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  smoke:
    name: E2E Smoke Test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    # The CLI ships as an AnyCPU `dotnet tool` (PackAsTool forbids a target
    # platform). Publishing it directly builds the project and its Core
    # ProjectReference in one pass, which avoids the multi-TFM + forced-x64
    # MSB3030 copy failure (Core.dll was looked for under bin\x64\... while the
    # publish resolved the AnyCPU output). No need to force a Platform here.
    - name: Publish CLI
      run: >-
        dotnet publish src/WinSentinel.Cli/WinSentinel.Cli.csproj
        --configuration Release
        --output ./artifacts/cli

    - name: Smoke test - CLI help
      run: ./artifacts/cli/winsentinel.exe --help

    - name: Smoke test - version
      run: ./artifacts/cli/winsentinel.exe --version

    - name: Smoke test - full audit (JSON)
      shell: pwsh
      run: |
        # Run the audit as a bounded child process and capture stdout/stderr to
        # files. Rationale:
        #  * STDOUT is the JSON payload; STDERR carries non-fatal diagnostics
        #    (e.g. the plugin-host "[plugin:warning]" line emitted on a clean
        #    runner with no %LOCALAPPDATA%\WinSentinel\plugins dir). Keeping the
        #    streams separate stops stderr from corrupting the JSON or tripping
        #    pwsh's populated-error-stream = failure behaviour.
        #  * A hard timeout turns a hung audit module into a clear, actionable
        #    failure instead of a silent step kill with an orphaned child
        #    process and zero output.
        $ErrorActionPreference = 'Continue'
        $outFile = 'audit-stdout.json'
        $errFile = 'audit-stderr.log'
        $timeoutSec = 180

        # Validate the JSON contract against a small, fast, deterministic module
        # subset rather than a full --audit. A full system audit on a clean CI
        # runner is slow and non-deterministic (some modules query services that
        # block or take minutes), which previously caused the step to hang past
        # its window and get killed with zero output and an orphaned child. The
        # JSON schema (overallScore/grade/modules) is identical regardless of
        # how many modules run, so a bounded subset fully exercises the contract.
        $proc = Start-Process -FilePath './artifacts/cli/winsentinel.exe' `
          -ArgumentList '--audit','--modules','firewall,defender','--json' `
          -RedirectStandardOutput $outFile `
          -RedirectStandardError $errFile `
          -NoNewWindow -PassThru

        if (-not $proc.WaitForExit($timeoutSec * 1000)) {
          try { $proc.Kill($true) } catch { }
          Write-Error "CLI audit did not complete within ${timeoutSec}s (hung module). Killed PID $($proc.Id)."
          if (Test-Path $errFile) { Write-Host "stderr so far:`n$(Get-Content $errFile -Raw)" }
          exit 1
        }
        $exitCode = $proc.ExitCode

        if (Test-Path $errFile) {
          # -Raw on an empty file returns $null, so guard before any string method.
          $stderr = Get-Content $errFile -Raw
          if (-not [string]::IsNullOrWhiteSpace($stderr)) {
            Write-Host "CLI diagnostics (stderr, non-fatal):`n$stderr"
          }
        }

        $output = if (Test-Path $outFile) { Get-Content $outFile -Raw } else { '' }

        # Exit codes 0 (pass), 1 (warnings), 2 (critical) are all valid audit completions
        if ($exitCode -gt 2) {
          Write-Error "CLI audit failed with exit code $exitCode"
          Write-Output $output
          exit 1
        }

        # Validate JSON structure
        try {
          $json = $output | ConvertFrom-Json
        } catch {
          Write-Error "CLI did not produce valid JSON output"
          Write-Output $output
          exit 1
        }

        # Verify expected top-level fields exist
        # The full --audit --json report (ReportGenerator.GenerateJsonReport)
        # emits overallScore/grade/modules at the top level (per-module objects
        # carry their own nested "score"). Assert the real contract.
        $requiredFields = @("overallScore", "grade", "modules")
        foreach ($field in $requiredFields) {
          if (-not ($json.PSObject.Properties.Name -contains $field)) {
            Write-Error "Missing required field '$field' in JSON output"
            exit 1
          }
        }

        Write-Output "## 🔥 Smoke Test Results" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "| Metric | Value |" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "|--------|-------|" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "| Score | **$($json.overallScore)** |" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "| Grade | **$($json.grade)** |" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "| Modules | $($json.modules.Count) |" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "| Exit Code | $exitCode |" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "✅ CLI produced valid JSON with all required fields" >> $env:GITHUB_STEP_SUMMARY

    - name: Smoke test - score-only mode
      shell: pwsh
      run: |
        # Exit codes 0 (pass), 1 (warnings), 2 (critical) are all valid audit
        # completions. On a clean CI runner the score is routinely <100 (warnings),
        # which returns exit 1; only >2 is a genuine CLI failure.
        & ./artifacts/cli/winsentinel.exe --score --quiet
        if ($LASTEXITCODE -gt 2) { exit 1 }

    - name: Smoke test - specific module
      shell: pwsh
      run: |
        & ./artifacts/cli/winsentinel.exe --audit --modules firewall --json | Out-Null
        if ($LASTEXITCODE -gt 2) { exit 1 }

    - name: Smoke test - threshold gate (should pass with 0)
      run: ./artifacts/cli/winsentinel.exe --audit --threshold 0 --quiet
