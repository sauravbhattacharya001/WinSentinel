name: Sync Version on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (for example, v1.25.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-version:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: main

    - name: Extract version from tag
      id: version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid release tag: $RELEASE_TAG" >&2
          exit 1
        fi
        echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

    - name: Update csproj versions
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        for csproj in src/WinSentinel.Core/WinSentinel.Core.csproj src/WinSentinel.Cli/WinSentinel.Cli.csproj; do
          if grep -q '<Version>' "$csproj"; then
            sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|g" "$csproj"
          else
            sed -i "/<TargetFramework/a\\    <Version>${VERSION}</Version>" "$csproj"
          fi
        done

    - name: Create version sync pull request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        commit-message: 'chore: sync package version to ${{ steps.version.outputs.version }}'
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        branch: automation/version-sync-${{ steps.version.outputs.version }}
        delete-branch: true
        title: 'chore: sync package version to ${{ steps.version.outputs.version }}'
        body: |
          Synchronizes project package versions with release `${{ steps.version.outputs.tag }}`.

          This pull request is generated instead of pushing directly to `main`, so normal branch protection and required checks remain in force.
        labels: automated
